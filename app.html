<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فتح المركز</title><script src="config.js"></script><script src="shared.js"></script></head><body><p id="loading">جارٍ التحقق من صلاحية المركز وتحميل بياناته…</p><script>
(async()=>{try{const id=new URLSearchParams(location.search).get('center');const ctx=await DQMC.rpc('dqmc_open_center',{p_token:DQMC.token(),p_center:id});sessionStorage.setItem('dqmc:context:'+id,JSON.stringify(ctx));let source=await (await fetch('center-app.html',{cache:'no-store'})).text();const esc=DQMC.escape;const js=v=>String(v).replace(/[\\'"`\r\n\u2028\u2029]/g,x=>({'\\':'\\\\',"'":"\\'",'"':'\\"','`':'\\`','\r':'\\r','\n':'\\n','\u2028':'\\u2028','\u2029':'\\u2029'}[x])).replace(/\$\{/g,'\\${').replace(/</g,'\\x3c');
const parts=source.split(/(<script\b[^>]*>[\s\S]*?<\/script>)/gi);source=parts.map(p=>{const encode=/^<script\b/i.test(p)?js:esc;return p.replaceAll('__DQ_CENTER_NAME__',()=>encode(ctx.center.name)).replaceAll('__DQ_CENTER_FOOTER__',()=>encode(ctx.center.footer||ctx.center.name))}).join('');document.open();document.write(source);document.close();}catch(e){document.getElementById('loading').textContent=DQMC.message(e);const a=document.createElement('a');a.href='index.html';a.textContent='العودة للدخول';document.body.append(a)}})();
</script></body></html>
