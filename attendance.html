<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حركة الدوام</title><script src="config.js"></script><script src="shared.js"></script></head><body><p id="loading">جارٍ تحميل صفحة المركز…</p><script>
(async()=>{try{const id=new URLSearchParams(location.search).get('center');if(!id)throw Error('رابط المركز غير مكتمل');const c=await DQMC.rpc('dqmc_public_center',{p_center:id});sessionStorage.setItem('dqmc:public:'+id,JSON.stringify(c));const s=await(await fetch('staff-app.html')).text();document.open();document.write(s.replaceAll('__DQ_CENTER_NAME__',()=>DQMC.escape(c.name)));document.close()}catch(e){document.getElementById('loading').textContent=DQMC.message(e)}})();
</script></body></html>
